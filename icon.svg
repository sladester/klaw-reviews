<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0d9488"/>

  <!-- Drink can: tilted, white body, lime top -->
  <g transform="translate(256 270) rotate(-12) translate(-90 -150)">
    <!-- Can body -->
    <rect x="0" y="20" width="180" height="280" rx="14" ry="14" fill="#ffffff"/>
    <!-- Can top -->
    <ellipse cx="90" cy="20" rx="90" ry="18" fill="#a3e635"/>
    <!-- Pull tab -->
    <rect x="74" y="6" width="32" height="10" rx="3" fill="#65a30d"/>
    <!-- Body shading -->
    <rect x="0" y="20" width="20" height="280" rx="14" fill="#000000" opacity="0.08"/>
    <rect x="160" y="20" width="20" height="280" rx="14" fill="#000000" opacity="0.05"/>
  </g>

  <!-- Three claw slashes across the can, top-left to bottom-right -->
  <g stroke="#dc2626" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M 130 130 Q 256 256 380 400"/>
    <path d="M 180 110 Q 306 236 430 380"/>
    <path d="M 230 110 Q 350 220 460 350"/>
  </g>
</svg>